<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Course Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 p-4 rounded-3">
                <div class="text-center mb-4">
                    <i class="bi bi-box-arrow-in-right display-5 text-primary"></i>
                    <h3 class="fw-bold mt-2">Sign In</h3>
                    <p class="text-muted small">Access your enrolled courses and exams</p>
                </div>
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger py-2 small">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>
                <div class="text-center mt-3 small">
                    Don't have an account? <a href="{% url 'onlinecourse:registration' %}">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
